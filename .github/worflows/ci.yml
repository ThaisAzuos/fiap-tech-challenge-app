name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: mvn -B verify

      - name: Check Test Coverage (JaCoCo)
        run: |
          # Verifica se o relatório de cobertura foi gerado
          [ -f target/site/jacoco/index.html ] && echo "Cobertura gerada com sucesso" || (echo "Falha: relatório de cobertura não encontrado" && exit 1)