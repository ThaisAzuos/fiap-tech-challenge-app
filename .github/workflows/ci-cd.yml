name: CI/CD Pipeline - Oficina Mecânica

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/oficina-mecanica-api
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache de dependências Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build com Maven
      run: ./mvnw -q clean compile

    - name: Subir MailHog (ambiente de teste)
      run: docker compose -f docker-compose.test.yml up -d mailhog

    - name: Aguardar MailHog responder SMTP
      run: |
        for i in {1..20}; do
          if (echo > /dev/tcp/127.0.0.1/1025) >/dev/null 2>&1; then
            echo "MailHog pronto na porta 1025"
            exit 0
          fi
          sleep 1
        done
        echo "MailHog nao respondeu em tempo" >&2
        exit 1

    - name: Executar testes
      run: ./mvnw -q test

    - name: Encerrar MailHog
      if: always()
      run: docker compose -f docker-compose.test.yml down

    - name: Gerar relatório de testes
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Testes JUnit
        path: 'target/surefire-reports/*.xml'
        reporter: java-junit
        fail-on-error: false

  build-docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Informar ausência de credenciais Docker Hub
      if: ${{ env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == '' }}
      run: echo "Secrets DOCKER_USERNAME/DOCKER_PASSWORD não configurados. Build e push da imagem serão ignorados sem falhar o workflow."

    - name: Checkout do código
      if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      uses: actions/checkout@v4

    - name: Configurar Docker Buildx
      if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      uses: docker/setup-buildx-action@v3

    - name: Login no Docker Hub
      if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extrair metadados
      if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build e push da imagem Docker
      if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-docker
    runs-on: ubuntu-latest

    steps:
    - name: Informar ausência de credenciais de deploy
      if: ${{ github.ref != 'refs/heads/main' || github.event_name != 'push' || env.KUBE_CONFIG == '' || env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == '' }}
      run: echo "Pré-requisitos de deploy não atendidos. O deploy Kubernetes será ignorado sem falhar o workflow."

    - name: Checkout do código
      if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && env.KUBE_CONFIG != '' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      uses: actions/checkout@v4

    - name: Configurar kubectl
      if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && env.KUBE_CONFIG != '' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Deploy no Kubernetes
      if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && env.KUBE_CONFIG != '' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      run: |
        # Atualizar imagem no deployment
        sed -i 's|image:.*|image: ${{ env.IMAGE_NAME }}:latest|g' k8s-deployment.yaml
        # Aplicar manifestos na ordem correta
        kubectl apply -f k8s-configmap.yaml
        kubectl apply -f k8s-postgres.yaml
        kubectl apply -f k8s-secret.yaml
        kubectl apply -f k8s-mailhog.yaml
        kubectl apply -f k8s-deployment.yaml
        kubectl apply -f k8s-service.yaml
        kubectl apply -f k8s-hpa.yaml
        # Aguardar rollout
        kubectl rollout status deployment/oficina-app

    - name: Verificar deploy
      if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && env.KUBE_CONFIG != '' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
      run: |
        kubectl get pods
        kubectl get svc
