name: CI — Build & Test (PRs)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache de dependências Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build com Maven
      run: ./mvnw -q clean compile

    - name: Subir MailHog (ambiente de teste)
      run: docker compose -f docker-compose.test.yml up -d mailhog

    - name: Aguardar MailHog responder SMTP
      run: |
        for i in {1..20}; do
          if (echo > /dev/tcp/127.0.0.1/1025) >/dev/null 2>&1; then
            echo "MailHog pronto na porta 1025"
            exit 0
          fi
          sleep 1
        done
        echo "MailHog nao respondeu em tempo" >&2
        exit 1

    - name: Executar testes
      run: ./mvnw -q test

    - name: Encerrar MailHog
      if: always()
      run: docker compose -f docker-compose.test.yml down

    - name: Gerar relatório de testes
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Testes JUnit
        path: 'target/surefire-reports/*.xml'
        reporter: java-junit
        fail-on-error: false

