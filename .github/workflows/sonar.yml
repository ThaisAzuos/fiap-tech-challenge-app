name: Análise SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  sonar:
    name: Build, Testes e Análise
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necessário para análise de histórico do Sonar

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache de pacotes SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Subir MailHog (ambiente de teste)
        run: docker compose -f docker-compose.test.yml up -d mailhog

      - name: Aguardar MailHog responder SMTP
        run: |
          for i in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/1025) >/dev/null 2>&1; then
              echo "MailHog pronto na porta 1025"
              exit 0
            fi
            sleep 1
          done
          echo "MailHog nao respondeu em tempo" >&2
          exit 1

      - name: Build, testes e geração de cobertura
        run: ./mvnw clean verify -DskipTests=false
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Informar ausência de configuração SonarQube
        if: ${{ env.SONAR_HOST_URL == '' || env.SONAR_TOKEN == '' }}
        run: echo "Secrets SONAR_HOST_URL/SONAR_TOKEN não configurados. Etapa de análise Sonar será ignorada sem falhar o workflow."

      - name: Executar análise SonarQube
        if: ${{ env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '' }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=com.grupo51:oficinamecanica \
            -Dsonar.projectName="Oficina Mecânica API" \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.junit.reportsPath=target/surefire-reports \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Upload do relatório de cobertura (artefato)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Encerrar MailHog
        if: always()
        run: docker compose -f docker-compose.test.yml down
