name: Spring Boot App CI/CD

on:
  push:
    branches:
      - main # Ou o nome da sua branch principal
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: 'Build & Test'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Maven Build and Test
        run: mvn clean install

      # SonarQube Scan (opcional, requer SonarQube server)
      - name: SonarQube Scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=com.grupo37:oficinamecanica -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  build-and-push-docker:
    name: 'Build & Push Docker Image'
    runs-on: ubuntu-latest
    needs: build-and-test # Depende do sucesso do build e testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Apenas para push na main

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-app-ecr-role # Role para ECR
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image
        env:
          ECR_REPOSITORY: fiap-tech-challenge-app
          IMAGE_TAG: ${{ github.sha }} # Usar o SHA do commit como tag
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        
      - name: Export image tag
        id: export_image_tag
        run: echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

  deploy-kubernetes:
    name: 'Deploy to Kubernetes'
    runs-on: ubuntu-latest
    needs: build-and-push-docker # Depende do sucesso do push da imagem
    environment:
      name: production # Ou o nome do seu ambiente de deploy
      # url: https://your-app-endpoint.com # Opcional: URL do endpoint da aplicação
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-app-eks-deploy-role # Role para deploy no EKS
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to Kubernetes
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          ECR_REPOSITORY: fiap-tech-challenge-app
          IMAGE_TAG: ${{ needs.build-and-push-docker.outputs.IMAGE_TAG }}
        run: |
          # Substituir imagem no manifesto de deployment
          sed -i "s|image: oficina-app:latest|image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}|g" k8s/deployment.yaml

          # Aplicar na ordem correta: ServiceAccount → ConfigMap → Secret → Deployment → Service → HPA → Ingress
          kubectl apply -f k8s/serviceaccount.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml

          # Aguardar rollout completo
          kubectl rollout status deployment/oficina-app --timeout=5m
