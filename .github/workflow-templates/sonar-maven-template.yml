name: Análise SonarQube (Template)

# TEMPLATE – copie para .github/workflows/sonar.yml para ativar.
# Consulte docs/operacional/sonarqube-producao.md para instruções completas.
#
# Secrets necessários no repositório GitHub:
#   SONAR_HOST_URL  – URL do servidor SonarQube (ex: http://seu-servidor:9000)
#   SONAR_TOKEN     – Token de análise gerado em Minha Conta > Segurança

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  sonar:
    name: Build, Testes e Análise
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache de pacotes SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, testes e geração de cobertura
        run: ./mvnw clean verify -DskipTests=false
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Executar análise SonarQube
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=com.grupo37:oficinamecanica \
            -Dsonar.projectName="Oficina Mecanica API" \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.junit.reportsPath=target/surefire-reports \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload do relatório de cobertura (artefato)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
