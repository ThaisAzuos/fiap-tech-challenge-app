name: SonarQube Analysis (Template)

# TEMPLATE – copie para .github/workflows/sonar.yml para ativar.
# Consulte docs/SONARQUBE_PRODUCAO.md para instrucoes completas.
#
# Secrets necessarios no repositorio GitHub:
#   SONAR_HOST_URL  – URL do servidor SonarQube (ex: http://seu-servidor:9000)
#   SONAR_TOKEN     – Token de analise gerado em My Account > Security

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  sonar:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, run tests and generate coverage report
        run: ./mvnw clean verify -DskipTests=false
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Run SonarQube analysis
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=com.grupo51:oficinamecanica \
            -Dsonar.projectName="Oficina Mecanica API" \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.junit.reportsPath=target/surefire-reports \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload coverage report (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
