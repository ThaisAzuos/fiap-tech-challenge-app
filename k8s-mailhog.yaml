apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-mailhog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-mailhog
  template:
    metadata:
      labels:
        app: oficina-mailhog
    spec:
      containers:
      - name: mailhog
        image: mailhog/mailhog:latest
        ports:
        - containerPort: 1025
          name: smtp
        - containerPort: 8025
          name: http
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: oficina-mailhog
spec:
  selector:
    app: oficina-mailhog
  ports:
  - name: smtp
    port: 1025
    targetPort: 1025
  - name: http
    port: 8025
    targetPort: 8025
  type: ClusterIP
