api:
  security:
    token:
      secret: secret_para_testes_nao_usar_em_producao
      public-key: src/test/resources/test_public_key.pem

lambda:
  auth:
    url: http://localhost:9000

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

# Fase 4 - Dia 3: desliga os beans de mensageria da Saga nos testes
# (RabbitMQConfig e SagaEventListener), pois nao ha broker RabbitMQ
# disponivel no ambiente de testes. Ver ADR-009.
saga:
  messaging:
    enabled: false
