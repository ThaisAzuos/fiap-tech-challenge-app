spring:
  application:
    name: oficina-mecanica-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina_db}
    username: ${SPRING_DATASOURCE_USERNAME:oficina_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:oficina_password}
    driver-class-name: org.postgresql.Driver

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update # Cria as tabelas automaticamente com base nas Entidades Ricas
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:your-email@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

# Configuração de Email personalizada
app:
  email:
    from: ${APP_EMAIL_FROM:noreply@oficinamecanica.com}
    fromName: ${APP_EMAIL_FROM_NAME:Oficina Mecânica}
    replyTo: ${APP_EMAIL_REPLY_TO:suporte@oficinamecanica.com}

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.oficina: DEBUG