spring:
  application:
    name: oficina-mecanica-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina_db}
    username: ${SPRING_DATASOURCE_USERNAME:oficina_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:oficina_password}
    driver-class-name: org.postgresql.Driver

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: none # Alterado para 'none' para Flyway
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway: # Configuração Flyway adicionada
    enabled: true
    locations: classpath:db/migration # Local dos scripts de migração
    baseline-on-migrate: true # Cria a tabela de histórico se não existir

  mail:
    # Ajuste: Default para localhost (MailHog) se a variável não estiver definida
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:user}
    password: ${SPRING_MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

# Configuração de Email personalizada
app:
  email:
    from: ${APP_EMAIL_FROM:noreply@oficinamecanica.com}
    fromName: ${APP_EMAIL_FROM_NAME:Oficina Mecânica}
    replyTo: ${APP_EMAIL_REPLY_TO:suporte@oficinamecanica.com}

api:
  security:
    token:
      public-key: ${API_SECURITY_TOKEN_PUBLIC_KEY} # Adicionado chave pública para validação JWT
      # secret e expiration-minutes removidos, pois a aplicação não gera mais JWTs

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.oficina: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    tags-sorter: alpha          # ordena as tags alfabeticamente → os prefixos numéricos definem a ordem
    operations-sorter: alpha    # ordena operações dentro da tag
    display-request-duration: true
    doc-expansion: none         # começa fechado, expande ao clicar
    filter: true                # habilita campo de busca
    default-models-expand-depth: 0
  show-actuator: false

# Configuração Lambda Auth
lambda:
  auth:
    url: ${LAMBDA_AUTH_URL:http://localhost:8080}
