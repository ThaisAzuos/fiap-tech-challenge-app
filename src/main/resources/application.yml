spring:
  application:
    name: oficina-mecanica-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina_db}
    username: ${SPRING_DATASOURCE_USERNAME:oficina_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:oficina_password}
    driver-class-name: org.postgresql.Driver

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:oficina_admin}
    password: ${SPRING_RABBITMQ_PASSWORD:oficina_password}


  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:user}
    password: ${SPRING_MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

api:
  security:
    token:
      public-key: ${API_SECURITY_TOKEN_PUBLIC_KEY:/app/public_key.pem}

lambda:
  auth:
    url: ${LAMBDA_AUTH_URL:http://localhost:8080}

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.oficina: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Saga Pattern (Fase 4 - Dia 3). Ver docs/arquitetura/fase4-visao-geral.md e ADR-009.
saga:
  messaging:
    enabled: ${SAGA_MESSAGING_ENABLED:true}
    exchange: tech-challenge.saga
    queue: os-service.eventos-saga
    dlq: os-service.eventos-saga.dlq
