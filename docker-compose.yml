version: '3.8'

services:
  app:
    container_name: oficina-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://oficina-db:5432/oficina_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-oficina_admin}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-oficina_password}
      API_SECURITY_TOKEN_SECRET: ${API_SECURITY_TOKEN_SECRET:-dev_secret_key_for_jwt_development}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailhog}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
    depends_on:
      - db
    networks:
      - app-network

  db:
    container_name: oficina-db
    image: postgres:13
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oficina_db}
      POSTGRES_USER: ${POSTGRES_USER:-oficina_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oficina_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oficina_admin} -d ${POSTGRES_DB:-oficina_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mailhog:
    container_name: oficina-mailhog
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
