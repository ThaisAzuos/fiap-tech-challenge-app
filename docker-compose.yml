version: '3.8'

services:
  db:
    container_name: oficina-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oficina_db}
      POSTGRES_USER: ${POSTGRES_USER:-oficina_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oficina_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oficina_admin} -d ${POSTGRES_DB:-oficina_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    ports:
      - "5432:5432"

  mailhog:
    container_name: oficina-mailhog
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - app-network

  app:
    container_name: oficina-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./public_key.pem:/app/public_key.pem:ro
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/oficina_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-oficina_admin}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-oficina_password}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailhog}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-user}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-password}
      API_SECURITY_TOKEN_PUBLIC_KEY: /app/public_key.pem
      LAMBDA_AUTH_URL: ${LAMBDA_AUTH_URL:-http://localhost:8080}
      NEW_RELIC_APP_NAME: oficina-mecanica-api
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
