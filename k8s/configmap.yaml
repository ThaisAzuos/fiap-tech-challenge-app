apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
  labels:
    app: oficina-app
data:
  # Spring boot properties
  SPRING_PROFILES_ACTIVE: "kubernetes"
  SPRING_APPLICATION_NAME: "oficina-mecanica-api"

  # Server
  SERVER_PORT: "8080"
  SERVER_SERVLET_CONTEXT_PATH: "/"

  # Logging
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_EXAMPLE: "DEBUG"

  # JPA/Hibernate
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQL15Dialect"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
  SPRING_JPA_SHOW_SQL: "false"

  # Connection pool
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "20000"

  # API Documentation
  SPRINGDOC_API_TITLE: "Oficina Mecanica API"
  SPRINGDOC_API_DESCRIPTION: "Sistema de gerenciamento de oficina mecânica"
  SPRINGDOC_API_VERSION: "1.0.0"
  SPRINGDOC_SWAGGER_UI_ENABLED: "true"

  # Lambda Auth
  LAMBDA_AUTH_URL: "https://gs9sfvolq0.execute-api.us-east-1.amazonaws.com/prod"

  # CORS
  CORS_ALLOWED_ORIGINS: "*"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "Content-Type,Authorization"

  # Actuator
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,metrics,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "when-authorized"
  MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"

