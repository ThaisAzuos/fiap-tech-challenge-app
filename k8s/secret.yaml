apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
  labels:
    app: oficina-app
type: Opaque
stringData:
  # Database connection (should be fetched from AWS Secrets Manager)
  database_url: "jdbc:postgresql://oficina-db:5432/oficina_db"
  database_username: "postgres"
  database_password: "changeme"  # REPLACE with actual password from RDS

  # JWT Configuration
  jwt_secret: "your-secret-key-change-this-in-production"
  jwt_expiration: "3600000"  # 1 hour in milliseconds

  # AWS Configuration (if needed)
  aws_region: "us-east-1"
  aws_s3_bucket: "oficina-app-bucket"

  # Email configuration (if applicable)
  mail_host: "smtp.gmail.com"
  mail_port: "587"
  mail_username: "your-email@gmail.com"
  mail_password: "your-app-password"
---
# NOTE: In production, use external secret management:
# - AWS Secrets Manager with External Secrets Operator
# - HashiCorp Vault
# - Sealed Secrets
# - Kyverno for policy enforcement

